name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  reporter-tests:
    name: Security report tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test .github/scripts/security-report.test.cjs

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure private module access
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          echo 'GOPRIVATE=github.com/telekom/t-caas-go-library' >> "$GITHUB_ENV"

      - name: Run govulncheck
        id: scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: make vuln
      - name: Report scan status
        if: always() && steps.scan.outcome != 'success'
        run: echo '::warning title=Security scan advisory::govulncheck reported findings or could not complete. See the scan logs.'

      - name: Check dependency licenses
        env:
          GH_TOKEN: ${{ github.token }}
        run: make licenses

  # CodeQL and dependency-review require GitHub Advanced Security on private
  # repositories. They are skipped while the repository is private and run
  # automatically once it is public.
  codeql:
    name: CodeQL (go)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        id: init
        continue-on-error: true
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual

      - name: Build all modules for CodeQL
        run: |
          go build ./...
          (cd pkg/redfish && go build ./...)
          (cd examples/redfish && go build -o /dev/null ./...)

      - name: Analyze
        id: scan
        if: steps.init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go
      - name: Report scan status
        if: always() && (steps.init.outcome != 'success' || steps.scan.outcome != 'success')
        run: echo '::warning title=Security scan advisory::CodeQL reported findings or could not complete. See the scan logs.'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        id: scan
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Report scan status
        if: always() && steps.scan.outcome != 'success'
        run: echo '::warning title=Security scan advisory::Dependency review reported findings or could not complete. See the scan logs.'
