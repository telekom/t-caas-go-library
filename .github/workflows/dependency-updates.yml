name: Dependency update configuration
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned validation tool
        # renovate: datasource=npm depName=renovate
        run: npm install --prefix "$RUNNER_TEMP/renovate" --no-audit --no-fund renovate@44.176.3
      - name: Validate configuration and exercise real updater behavior
        env:
          RENOVATE_PACKAGE_DIR: ${{ runner.temp }}/renovate/node_modules/renovate
        run: |
          "$RUNNER_TEMP/renovate/node_modules/.bin/renovate-config-validator" --strict .github/renovate.json
          node --test .github/scripts/dependency-updates.test.mjs
