version: 2
updates:
  # Go tools built by the Makefile (tool directives). Only the tools
  # themselves are bumped so golangci-lint keeps its upstream dependency set.
  - package-ecosystem: gomod
    directories:
      - /hack/tools
      - /hack/tools/golangci-lint
    allow:
      - dependency-name: github.com/golangci/golangci-lint/v2
      - dependency-name: github.com/google/go-licenses/v2
      - dependency-name: golang.org/x/vuln
      - dependency-name: sigs.k8s.io/controller-runtime/tools/setup-envtest
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 20
    commit-message:
      prefix: deps
    labels: [dependencies, go]
    groups:
      go-tools:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    commit-message:
      prefix: deps
    labels: [dependencies, go]
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      prometheus:
        patterns: ["github.com/prometheus/*"]
      testing:
        patterns: ["github.com/onsi/*", "github.com/stretchr/testify"]
      go-other:
        patterns: ["*"]
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "go.opentelemetry.io/*"
          - "github.com/prometheus/*"
          - "github.com/onsi/*"
          - "github.com/stretchr/testify"

  - package-ecosystem: gomod
    directory: /pkg/redfish
    allow:
      - dependency-type: all
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    commit-message:
      prefix: deps
    labels: [dependencies, go]

  - package-ecosystem: gomod
    directory: /examples/redfish
    allow:
      - dependency-type: all
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    commit-message:
      prefix: deps
    labels: [dependencies, go]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]
