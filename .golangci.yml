version: "2"
run:
  go: "1.26"
  allow-parallel-runners: true
  timeout: 10m
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - ginkgolinter
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - intrange
    - lll
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace

  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - appendAssign
        - commentedOutCode
        - hugeParam
        - rangeValCopy
        - regexpMust
    gocyclo:
      min-complexity: 20
    godot:
      scope: toplevel
      exclude:
        - "SPDX-"
        - "\\+kubebuilder"
    importas:
      no-unaliased: true
      alias:
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/api/rbac/v1
          alias: rbacv1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/apimachinery/pkg/api/meta
          alias: apimeta
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: sigs.k8s.io/controller-runtime
          alias: ctrl
    lll:
      line-length: 140
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-naming

  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters:
          - dupl
          - errcheck
          - goconst
          - gocritic
          - godot
          - gosec
      - path: _test\.go$
        linters:
          - revive
        text: "dot-imports"
      - path: _test\.go$
        linters:
          - thelper
        text: "ginkgo"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/telekom/t-caas-go-library
  exclusions:
    generated: lax
